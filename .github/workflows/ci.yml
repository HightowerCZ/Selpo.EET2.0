name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    # net481 requires the .NET Framework SDK/targeting pack, which is only preinstalled on Windows runners.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Selpo.EET2.0.sln

      - name: Build
        run: dotnet build Selpo.EET2.0.sln --configuration Release --no-restore

      - name: Build netstandard2.0 target
        run: dotnet build src/Selpo.EET2.0/Selpo.EET2.0.csproj --configuration Release --no-restore --framework netstandard2.0

      - name: Test
        run: dotnet test Selpo.EET2.0.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path artifacts/coverage -Filter coverage.cobertura.xml -Recurse -File)
          if ($reports.Count -eq 0) {
            throw 'No Cobertura coverage reports were produced.'
          }
          $lowestLineRate = 1.0
          $lowestBranchRate = 1.0
          foreach ($report in $reports) {
            [xml]$coverage = Get-Content -Raw $report.FullName
            $lowestLineRate = [Math]::Min($lowestLineRate, [double]$coverage.coverage.'line-rate')
            $lowestBranchRate = [Math]::Min($lowestBranchRate, [double]$coverage.coverage.'branch-rate')
          }
          Write-Host ('Lowest line coverage: {0:P2}' -f $lowestLineRate)
          Write-Host ('Lowest branch coverage: {0:P2}' -f $lowestBranchRate)
          if ($lowestLineRate -lt 0.80 -or $lowestBranchRate -lt 0.60) {
            throw 'Coverage is below the required minimum of 80% lines and 60% branches.'
          }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Publish code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: warn

      - name: Pack (validation only)
        run: dotnet pack src/Selpo.EET2.0/Selpo.EET2.0.csproj --configuration Release --no-build --output ${{ runner.temp }}/nupkg

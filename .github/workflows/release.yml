name: Release

# Publishes Selpo.EET2.0 to NuGet.org using Trusted Publishing (OIDC) - no long-lived API key secret.
#
# Trigger by pushing a tag matching v*.*.* (e.g. v0.1.0). The tag value (without the leading "v")
# is used as the published NuGet package version, overriding <VersionPrefix> in the csproj.
#
# Requires a Trusted Publishing policy configured on nuget.org for this repository, workflow file
# (release.yml) and the "release" environment, plus a repository/environment variable named
# NUGET_USER containing the nuget.org username (profile name) that owns the policy.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 0.1.0). Required when run manually.'
        required: true

permissions:
  contents: read

jobs:
  build-test-pack-publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write # required to create the GitHub release and attach package artifacts
      id-token: write # required to request the OIDC token exchanged for a short-lived NuGet API key

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          # Reject versions that do not follow SemVer 2.0.
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            Write-Error "Version '$version' is not a valid SemVer version (expected e.g. 1.2.3 or 1.2.3-beta.1)."
            exit 1
          }
          Write-Host "Resolved package version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Selpo.EET2.0.sln

      - name: Build
        run: dotnet build Selpo.EET2.0.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Selpo.EET2.0.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Pack
        run: dotnet pack src/Selpo.EET2.0/Selpo.EET2.0.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ${{ runner.temp }}/nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            ${{ runner.temp }}/nupkg/*.nupkg
            ${{ runner.temp }}/nupkg/*.snupkg

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ runner.temp }}/nupkg" -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/nupkg/*.nupkg
            ${{ runner.temp }}/nupkg/*.snupkg

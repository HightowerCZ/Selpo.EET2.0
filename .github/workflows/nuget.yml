name: Build and publish NuGet package

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Selpo.EET2.0.sln

      - name: Build
        run: dotnet build Selpo.EET2.0.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Selpo.EET2.0.Tests/Selpo.EET2.0.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        shell: pwsh
        run: |
          $project = "src/Selpo.EET2.0/Selpo.EET2.0.csproj"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".Substring(1)
            dotnet pack $project --configuration Release --no-build --output ./packages -p:PackageVersion=$version
          }
          else {
            dotnet pack $project --configuration Release --no-build --output ./packages
          }

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          dotnet nuget push "./packages/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
